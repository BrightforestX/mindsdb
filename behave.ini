[behave]
# Feature file locations
paths = features

# Step definition paths
step_definitions = features/steps

# Formatter settings - JSON output required for roadmap generation
format = json.pretty,html
outfiles = reports/behave.json,reports/behave.html

# Tag filtering options
# Use --tags=@api to run only API tests
# Use --tags=@slow to run slow tests
# Use --tags=~@skip to exclude skipped tests

# Show timings
show_timings = true

# Show skipped steps
show_skipped = true

# Stop on first failure (useful for debugging)
# stop = true

# Verbose output
verbose = true

# Color output
color = true

# Log level
logging_level = INFO

# Environment file (if needed)
# environment_file = .env
