# Docker Compose override for production environment
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  mindsdb:
    # Use pre-built image for production (no local build)
    build: null  # Disable local build
    environment:
      FLASK_DEBUG: 0  # Disable debug mode in production
      MINDSDB_LOG_LEVEL: ${MINDSDB_LOG_LEVEL:-INFO}
      SENTRY_IO_ENVIRONMENT: production
      LANGFUSE_ENVIRONMENT: production
      OTEL_SERVICE_ENVIRONMENT: production
      # Production typically uses OTLP exporter
      OTEL_EXPORTER_TYPE: ${OTEL_EXPORTER_TYPE:-otlp}
      OTEL_EXPORTER_PROTOCOL: ${OTEL_EXPORTER_PROTOCOL:-grpc}
      OTEL_OTLP_ENDPOINT: ${OTEL_OTLP_ENDPOINT:-http://otel-collector:4317}
    volumes: []  # Don't mount source code in production
    restart: unless-stopped  # More robust restart policy for production
    deploy:
      resources:
        limits:
          cpus: ${MINDSDB_CPU_LIMIT:-4}
          memory: ${MINDSDB_MEMORY_LIMIT:-8G}
        reservations:
          cpus: ${MINDSDB_CPU_RESERVATION:-2}
          memory: ${MINDSDB_MEMORY_RESERVATION:-4G}

  postgres:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-2}
          memory: ${POSTGRES_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${POSTGRES_CPU_RESERVATION:-1}
          memory: ${POSTGRES_MEMORY_RESERVATION:-1G}

  # Disable observability services by default in production
  # Enable them by setting profiles in docker-compose command or environment
  otel-collector:
    profiles:
      - observability
    restart: unless-stopped

  langfuse:
    profiles:
      - observability
    restart: unless-stopped
    environment:
      - LANGFUSE_DEBUG=False

  # Keep autoheal in production for container health management
  autoheal:
    restart: unless-stopped
